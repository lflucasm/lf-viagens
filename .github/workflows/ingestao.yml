name: Ingestao de voos (nuvem)

# Espelha os voos da Volly na tabela `voos` do painel (todos os reminders
# aereos, com ou sem emissao), marca trecho incompleto e aprende fuso de
# aeroporto novo. Grava batimento `ingestao` pro supervisor. So LE da Volly.
# Ver src/ingestao_cloud.py (parte 1 do fluxo na nuvem, spec 2026-09-26).
#
# A cada 2h na hora cheia. O monitor Volly (checar-volly-cloud.yml) roda de
# hora em hora no minuto :15, entao pega a lista ja renovada.
#
# concurrency: grupo COMPARTILHADO com todo workflow que autentica na Volly
# (refresh_token giratorio de uso unico em milhasflow_auth_state; ver
# 2026-09-17) - dois ao mesmo tempo queimam o token um do outro.
concurrency:
  group: milhasflow-auth
  cancel-in-progress: false

on:
  # schedule movido pro ciclo.yml em 15/10/2026 (cota de minutos do GitHub
  # Actions) - aqui fica so o disparo manual / pelo site
  workflow_dispatch:
    inputs:
      plano:
        description: "Simulacao (mostra o que faria, sem gravar nada)"
        type: boolean
        default: false

env:
  PYTHONPATH: src
  LOG_SEGURO: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
  CHAT_URL: ${{ secrets.CHAT_URL }}
  CHAT_ANON_KEY: ${{ secrets.CHAT_ANON_KEY }}
  CHAT_ORGANIZATION_ID: ${{ secrets.CHAT_ORGANIZATION_ID }}

jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # leitura do nome do passageiro no voucher em PDF (src/vouchers.py)
      - name: Instalar pypdf
        run: pip install pypdf

      - name: Espelhar voos da Volly no painel
        env:
          SUPABASE_WEB_URL: ${{ secrets.SUPABASE_WEB_URL }}
          SUPABASE_WEB_SERVICE_KEY: ${{ secrets.SUPABASE_WEB_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MILHASFLOW_EMAIL: ${{ secrets.MILHASFLOW_EMAIL }}
          MILHASFLOW_SENHA: ${{ secrets.MILHASFLOW_SENHA }}
          MILHASFLOW_ANON_KEY: ${{ secrets.MILHASFLOW_ANON_KEY }}
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAINEL_WEB_URL: https://lf-viagens-admin.vercel.app
          PLANO: ${{ github.event.inputs.plano }}
        run: |
          ARGS=""
          if [ "$PLANO" = "true" ]; then
            ARGS="$ARGS --plano"
          fi
          python3 src/ingestao_cloud.py $ARGS
