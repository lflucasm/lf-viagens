name: Reconferência (nuvem)

# Disparado pelo site quando a equipe clica "Verificado — passageiro avisado"
# (web/lib/github.ts: dispararReconferencia). Le a companhia de novo - portal
# da cia (LATAM/GOL/Azul), monitor Volly forcado e, em ultimo caso, a malha -
# e grava em propostas_volly o que MUDARIA no cadastro da Volly, com aviso no
# Telegram. NUNCA escreve na Volly (spec do fluxo na nuvem, parte 4,
# 26/09/2026). Ver src/reconferir_cloud.py.
#
# concurrency: grupo COMPARTILHADO com todo workflow que autentica na Volly
# (refresh_token giratorio, uso unico - ver 2026-09-17). Sem cancel: dois
# "verificado" seguidos esperam a vez, nenhum se perde.
concurrency:
  group: milhasflow-auth
  cancel-in-progress: false

on:
  # schedule movido pro ciclo.yml em 15/10/2026 (cota de minutos do GitHub
  # Actions) - aqui fica so o disparo manual / pelo site
  workflow_dispatch:
    inputs:
      voo_id:
        description: "Id do voo (vazio = so a fila)"
        required: false
        default: ""
      historico_id:
        description: "Id do alerta verificado (historico.id)"
        required: false
        default: ""
      plano:
        description: "Simulacao (nao grava proposta nem batimento)"
        type: boolean
        default: false

env:
  PYTHONPATH: src
  LOG_SEGURO: "1"
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
  CHAT_URL: ${{ secrets.CHAT_URL }}
  CHAT_ANON_KEY: ${{ secrets.CHAT_ANON_KEY }}
  CHAT_ORGANIZATION_ID: ${{ secrets.CHAT_ORGANIZATION_ID }}

jobs:
  reconferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # o portal da cia precisa de Chrome real sob Xvfb (anti-bot), igual
      # checar-latam-cloud.yml
      # rodada de hora em hora com fila vazia nao instala Chrome nem loga na
      # Volly (nao gasta o refresh_token giratorio a toa)
      - name: Fila
        id: fila
        env:
          SUPABASE_WEB_URL: ${{ secrets.SUPABASE_WEB_URL }}
          SUPABASE_WEB_SERVICE_KEY: ${{ secrets.SUPABASE_WEB_SERVICE_KEY }}
        run: echo "n=$(python3 src/reconferir_cloud.py --contar | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Instalar Chrome + Playwright + Xvfb
        if: github.event_name == 'workflow_dispatch' || steps.fila.outputs.n != '0'
        run: |
          # a imagem do GitHub ja traz Xvfb e Chrome (15/10/2026: ~35s a
          # menos por rodada) - so instala o que faltar
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          pip install playwright
          if [ ! -x /opt/google/chrome/chrome ]; then
            python3 -m playwright install --with-deps chrome
          fi

      - name: Reconferir
        if: github.event_name == 'workflow_dispatch' || steps.fila.outputs.n != '0'
        env:
          SUPABASE_WEB_URL: ${{ secrets.SUPABASE_WEB_URL }}
          SUPABASE_WEB_SERVICE_KEY: ${{ secrets.SUPABASE_WEB_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MILHASFLOW_EMAIL: ${{ secrets.MILHASFLOW_EMAIL }}
          MILHASFLOW_SENHA: ${{ secrets.MILHASFLOW_SENHA }}
          MILHASFLOW_ANON_KEY: ${{ secrets.MILHASFLOW_ANON_KEY }}
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAINEL_WEB_URL: https://lf-viagens-admin.vercel.app
          VOO_ID: ${{ github.event.inputs.voo_id }}
          HISTORICO_ID: ${{ github.event.inputs.historico_id }}
          PLANO: ${{ github.event.inputs.plano }}
        run: |
          ARGS=""
          if [ -n "$VOO_ID" ]; then
            ARGS="--voo $VOO_ID"
          fi
          if [ -n "$HISTORICO_ID" ]; then
            ARGS="$ARGS --historico $HISTORICO_ID"
          fi
          if [ "$PLANO" = "true" ]; then
            ARGS="$ARGS --plano"
          fi
          xvfb-run -a python3 src/reconferir_cloud.py $ARGS
