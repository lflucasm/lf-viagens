name: Diagnostico temporario
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir secrets (so tamanhos e codigos HTTP)
        env:
          U: ${{ secrets.SUPABASE_WEB_URL }}
          K: ${{ secrets.SUPABASE_WEB_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          for n in ("U", "K"):
              v = os.environ.get(n, "")
              print(n, "len=%d" % len(v), "espaco/aspas/quebra=%s" % any(c in v for c in ' "\'\n\r\t'))
          u, k = os.environ["U"].strip(), os.environ["K"].strip()
          try:
              r = urllib.request.Request(u.rstrip("/") + "/rest/v1/supervisor_estado?select=chave&limit=1", headers={"apikey": k, "Authorization": "Bearer " + k})
              print("HTTP", urllib.request.urlopen(r, timeout=20).status)
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
          except Exception as e:
              print("EXC", type(e).__name__)
          PY
